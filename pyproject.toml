[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esxkit"
version = "0.2.0"
description = "Free, open-source toolkit for Xactimate .esx estimate files — read, create, validate, extract, audit, reconcile."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Anthoney Quebedeaux" }]
keywords = [
    "xactimate", "esx", "insurance", "claims", "estimating",
    "supplement", "audit", "reconciliation", "restoration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Insurance",
]
dependencies = ["openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/Anthoneyq/esxkit"
Issues = "https://github.com/Anthoneyq/esxkit/issues"

[project.scripts]
esxkit = "esxkit.__main__:main"

[tool.setuptools.packages.find]
include = ["esxkit*"]
